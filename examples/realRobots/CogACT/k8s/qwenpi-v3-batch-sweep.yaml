apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: yuming-starvla-cogact-qwenpi-v3-batch-sweep
  namespace: bonete05
spec:
  queue: bonete05
  priorityClassName: high
  minAvailable: 1
  plugins: {ssh: [], svc: [], env: []}
  tasks:
    - name: server
      replicas: 1
      template:
        metadata:
          labels:
            app: yuming-starvla-cogact-qwenpi-v3-batch-sweep
        spec:
          schedulerName: volcano
          restartPolicy: Never
          volumes:
            - name: dshm
              emptyDir: {medium: Memory, sizeLimit: 100Gi}
            - name: data
              persistentVolumeClaim: {claimName: pvc-vast-bonete05}
          tolerations:
            - {key: rdma, operator: Exists, effect: NoSchedule}
            - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
          containers:
            - name: server
              image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
              volumeMounts:
                - {name: dshm, mountPath: /dev/shm}
                - {name: data, mountPath: /data}
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update -y
                  apt-get install -y --no-install-recommends git libgl1 libglib2.0-0

                  CODE_REV=0a095d6b0dab324aadc469a96a21ca78cf994f33
                  JOB_TAG=starvla-cogact-qwenpi-v3-preflight
                  DST=/data/yuming/code_copies/$JOB_TAG
                  if [[ ! -d "$DST/.git" ]]; then
                    git clone --depth 10 --branch cogact_baseline https://github.com/starrliu/starVLA.git "$DST"
                  fi
                  cd "$DST"
                  git fetch --depth 10 origin cogact_baseline
                  git checkout "$CODE_REV"
                  test "$(git rev-parse HEAD)" = "$CODE_REV"

                  if [[ ! -x .venv/bin/accelerate ]]; then
                    python -m venv --system-site-packages .venv
                    . .venv/bin/activate
                    python -m pip install --upgrade pip setuptools wheel
                    python -m pip install --no-cache-dir -r examples/realRobots/CogACT/requirements-cluster.txt
                  else
                    . .venv/bin/activate
                  fi
                  python -m pip install --no-deps -e .
                  python - <<'PY'
                  import torch, torchvision, transformers, deepspeed
                  print("torch", torch.__version__, "cuda", torch.version.cuda)
                  print("torchvision", torchvision.__version__)
                  print("transformers", transformers.__version__)
                  print("deepspeed", deepspeed.__version__)
                  assert torch.cuda.device_count() == 8
                  PY

                  export WANDB_MODE=disabled
                  export PYTHONUNBUFFERED=1
                  export OMP_NUM_THREADS=1
                  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
                  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1
                  export NCCL_ASYNC_ERROR_HANDLING=1
                  export NCCL_TIMEOUT=1800000
                  export OPENCV_FFMPEG_READ_ATTEMPTS=10000000

                  mkdir -p /data/yuming/logs
                  overall_status=0
                  for batch_size in 16 32 64; do
                    run_id=cogact-all-v5-qwenpi-v3-sweep-b${batch_size}
                    rm -rf "/data/yuming/starvla/checkpoints/$run_id"
                    start_time="$(TZ=Asia/Shanghai date +%Y%m%d_%H%M%S)"
                    echo "SWEEP_START model=qwenpi-v3 batch=$batch_size $(date --iso-8601=seconds)"
                    set +e
                    FRAMEWORK=qwenpi_v3 \
                    NUM_PROCESSES=8 \
                    USE_DEEPSPEED=1 \
                    GLOBAL_BATCH_SIZE=512 \
                    BATCH_SIZE="$batch_size" \
                    NUM_WORKERS=4 \
                    DATA_ROOT=/data/liluo/msra_process \
                    MAX_STEPS=3 \
                    SAVE_FINAL_MODEL=false \
                    LOGGING_FREQUENCY=1 \
                    RUN_ROOT_DIR=/data/yuming/starvla/checkpoints \
                    RUN_ID="$run_id" \
                      bash examples/realRobots/CogACT/train_files/run_cogact_train.sh \
                      2>&1 | tee "/data/yuming/logs/${run_id}_${start_time}.log"
                    status=${PIPESTATUS[0]}
                    set -e
                    echo "SWEEP_RESULT model=qwenpi-v3 batch=$batch_size status=$status $(date --iso-8601=seconds)"
                    if [[ "$status" != "0" ]]; then overall_status=1; fi
                    sleep 10
                  done
                  exit "$overall_status"
              resources:
                requests:
                  nvidia.com/gpu: "8"
                  cpu: "104"
                  memory: "2600Gi"
                  rdma/rdma_shared_device_a: "1"
                limits:
                  nvidia.com/gpu: "8"
                  cpu: "104"
                  memory: "2600Gi"
                  rdma/rdma_shared_device_a: "1"
